name: Build NumberGuess

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install OCRA
        run: gem install ocra

      - name: Build executable
        run: ocra main.rb --output NumberGuess.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NumberGuess-Windows
          path: NumberGuess.exe